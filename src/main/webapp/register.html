<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    background: radial-gradient(circle at center, #2a2a2a, #121212);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card */
.container {
    background: #1e1e1e;
    padding: 30px 35px;
    width: 350px;
    border-radius: 15px;
    box-shadow: 0px 10px 40px rgba(0,0,0,0.6);
}

/* Title */
.container h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #ff8c42;
    font-weight: 600;
}

/* Labels */
label {
    font-size: 14px;
    color: #ccc;
    display: block;
    margin-bottom: 6px;
}

/* Inputs */
input, textarea, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: #2a2a2a;
    color: #fff;
    font-size: 14px;
    transition: 0.3s;
}

/* Focus Glow */
input:focus, textarea:focus {
    border: 1px solid #ff8c42;
    box-shadow: 0 0 8px rgba(255, 140, 66, 0.6);
}

/* Button */
button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    background: linear-gradient(90deg, #ff7a18, #ffb347);
    transition: 0.3s;
}

/* Button Hover */
button:hover {
    opacity: 0.9;
}

/* Footer text */
.footer {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
    color: #aaa;
}

.footer a {
    color: #ff8c42;
    text-decoration: none;
    font-weight: 500;
}

.footer a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="container">
    <h2>Create Account</h2>

    <form action="RegisterServlet" method="post">

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="••••" required>
        
        <input type="hidden" name="role" value="Customer">

        <label>Address</label>
        <textarea name="address" placeholder="Enter address" required></textarea>

        <button type="submit">Register</button>

    </form>

    <div class="footer">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

</body>
</html>
